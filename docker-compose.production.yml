# Docker Compose для продакшена (многопользовательская версия)
# 
# Использование:
# 1. Скопируйте .env.production.example в .env.production и заполните переменные
# 2. docker compose -f docker-compose.production.yml up -d
#
# Настройка:
# - REGISTRATION_MODE: open | invite | closed
# - MAX_USERS: 0 (без лимита) или число
# - INVITE_CODE: код для режима invite

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: ai-assistant-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Next.js приложение ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-assistant-production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ai_assistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_assistant}
      # Аутентификация
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env.production}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      - MAX_USERS=${MAX_USERS:-0}
      - INVITE_CODE=${INVITE_CODE:-}
      # Cookie secure flag (set to 'true' only for HTTPS)
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # App URL (для ссылок в email)
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # SMTP (для отправки email: сброс пароля, верификация)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # AI API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_PROXY_URL=${ANTHROPIC_PROXY_URL:-}
      - ANTHROPIC_PROXY_SECRET=${ANTHROPIC_PROXY_SECRET:-}
      # Telegram notifications
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID:-}
      # Шифрование данных (AES-256-GCM)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      # Backup directory
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r)=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error', ()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security: run as non-root
    user: "1001:1001"
    # Security: read-only filesystem — prevents malware from writing/executing binaries
    read_only: true
    tmpfs:
      - /tmp:size=50M,noexec,nosuid,nodev
      - /app/.next/cache:size=200M,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Ежедневный бэкап PostgreSQL (03:00, хранит 30 последних) ----
  backup:
    image: postgres:16-alpine
    container_name: ai-assistant-backup
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-ai_assistant}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-ai_assistant}
    volumes:
      - ./backups:/backups
      - ./scripts/prod-backup.sh:/usr/local/bin/prod-backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        env | grep '^PG' > /run/pg.env
        /usr/local/bin/prod-backup.sh
        echo "0 3 * * * /usr/local/bin/prod-backup.sh" | crontab -
        exec crond -f -l 8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Опционально: автоматический HTTPS с Caddy
  # Раскомментируйте если нужен HTTPS
  #
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: ai-assistant-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - app
  #   restart: unless-stopped

volumes:
  pgdata:
    driver: local
  # caddy_data:
  #   driver: local
  # caddy_config:
  #   driver: local

networks:
  default:
    name: ai-assistant-network
