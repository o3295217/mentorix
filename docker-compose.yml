services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-assistant-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ai_assistant:ai_assistant_dev@host.docker.internal:5432/ai_assistant
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
